name: CI
on:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test
      - run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://henuoc.com
          DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
          # Giả: chỉ để qua validate env.server.ts lúc build. Giá trị thật đặt ở panel AZDIGI.
          BETTER_AUTH_SECRET: build-only-fake-secret-0000000000000000
          BETTER_AUTH_URL: http://localhost:3000
          GOOGLE_CLIENT_ID: build-fake-google-client-id
          GOOGLE_CLIENT_SECRET: build-fake-google-client-secret
          RESEND_API_KEY: re_build
      - name: Standalone output tồn tại
        run: test -f .next/standalone/server.js
